name: Verify PowerShell path pattern fix

on:
  push:
    branches: [fix/powershell-test-path-pattern]

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test tests/JestProcessManagement/JestProcess.test.ts --runInBand
      - run: yarn tsc
      - name: Remove temporary verification workflow
        if: success()
        run: |
          rm .github/workflows/verify-powershell-pattern-fix.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/workflows/verify-powershell-pattern-fix.yml
          git commit -m "chore: remove temporary verification workflow"
          git push