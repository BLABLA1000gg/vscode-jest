name: Apply PowerShell test path pattern fix

on:
  push:
    branches: [fix/powershell-test-path-pattern]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/powershell-test-path-pattern
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Apply focused fix and regression test
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source_path = Path('src/JestProcessManagement/JestProcess.ts')
          source = source_path.read_text()
          start = source.index('  private quoteFilePattern(aString: string): string {')
          end = source.index('\n  }', start) + len('\n  }')
          replacement = '''  private quoteFilePattern(aString: string): string {
            return shellQuote(
              removeSurroundingQuote(aString),
              this.extContext.settings.shell.toSetting()
            );
          }'''
          source_path.write_text(source[:start] + replacement + source[end:])

          test_path = Path('tests/JestProcessManagement/JestProcess.test.ts')
          test = test_path.read_text()
          marker = "    describe('supports jest v30 options', () => {"
          regression = r'''    it('quotes test path patterns for PowerShell without shell re-escaping', () => {
            mockPlatform.mockReturnValue('win32');
            extContext.settings.shell.toSetting.mockReturnValue('pwsh');
            const request = mockRequest('by-file-pattern', {
              testFileNamePattern: 'C:\\repo\\src\\example.test.ts',
            });

            jestProcess = new JestProcess(extContext, request);
            jestProcess.start();

            const [, options] = RunnerClassMock.mock.calls[0];
            expect(options.args.args).toContain("'C:\\\\repo\\\\src\\\\example\\.test\\.ts'");
          });
          '''
          if marker not in test:
              raise RuntimeError('test insertion marker not found')
          test_path.write_text(test.replace(marker, regression + marker, 1))
          PY
      - run: yarn install --frozen-lockfile
      - run: yarn test tests/JestProcessManagement/JestProcess.test.ts --runInBand
      - run: yarn tsc
      - name: Commit clean patch
        shell: bash
        run: |
          rm .github/workflows/apply-powershell-pattern-fix.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/JestProcessManagement/JestProcess.ts tests/JestProcessManagement/JestProcess.test.ts .github/workflows/apply-powershell-pattern-fix.yml
          git commit -m "fix: quote test path patterns for PowerShell"
          git push
